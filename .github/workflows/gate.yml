name: Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Import Linter
        run: python -c "from importlinter.cli import lint_imports_command; lint_imports_command()"

      - name: Run mypy
        run: python -m mypy app

      - name: Run pytest
        run: python -m pytest
